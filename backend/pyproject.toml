[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qfae-backend"
version = "0.1.0"
description = "Q-FAE FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "openpyxl>=3.1,<4.0",
  "pydantic-settings>=2.6,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "redis>=7.0,<9.0",
  "sqlalchemy>=2.0,<3.0",
  "upstox-python-sdk>=2.29,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
